[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ml-research-agent"
version = "0.1.0"
description = "An opencode-style terminal CLI for autonomous ML research experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "textual>=0.80",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = [
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
]

[project.scripts]
automl = "research_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
